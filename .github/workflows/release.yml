name: Release APLite

# Pushing a tag such as v1.0.0 builds an unsigned APLite IPA and publishes it.
# This workflow is intentionally not run by the development branch; releases are created only
# when explicitly requested by pushing a tag or running it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (the tag becomes v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Beta builds must not show up as the latest stable release in the in-app update checker.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          # Marketing version stays numeric: "1.3.0-beta.1" must not become the in-app version
          # "1.3.0-beta.1 (beta 1)". The prerelease part only sets the channel and artifact name.
          echo "build_version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-beta*)
              N="${VERSION##*-}"          # "beta.2"
              N="${N#beta.}"              # "2"
              echo "channel=beta $N" >> "$GITHUB_OUTPUT"
              echo "display=${VERSION%%-*} (beta $N)" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "channel=" >> "$GITHUB_OUTPUT"
              echo "display=$VERSION" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate local asset library
        run: python3 scripts/validate-assets.py

      - name: Build unsigned IPA
        run: VERSION=${{ steps.version.outputs.build_version }} BUILD_NUMBER=${{ github.run_number }} RELEASE_CHANNEL="${{ steps.version.outputs.channel }}" scripts/build-ipa.sh

      - name: Unit tests (all APLite modules)
        run: |
          SIM=$(xcrun simctl list devices available | grep -E '^    iPhone .* \(' | head -1 | sed -E 's/^    ([^()]+).*/\1/' | xargs)
          test -n "$SIM" || { echo "No iPhone simulator available"; exit 1; }
          echo "Using simulator: $SIM"
          set -o pipefail
          xcodebuild test -project APLite.xcodeproj -scheme APLiteTests \
            -destination "platform=iOS Simulator,name=$SIM" -quiet 2>&1 | tee build/xcodebuild-test.log

      - name: Name the IPA after its signing state and version
        run: mv build/APLite.ipa "build/APLite-unsigned-${{ steps.version.outputs.version }}.ipa"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Prefer the reviewed, checked-in notes. Fall back to a short honest stub for versions
          # that have no dedicated notes file. Never let --generate-notes replace curated text.
          NOTES="RELEASE_NOTES_${{ steps.version.outputs.build_version }}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" notes.md
          else
            cat > notes.md <<EOF
          APLite $VERSION — unsigned IPA. Sign it with your own certificate (ESign, Feather, Scarlet, ...) before installing.

          APLite is an independently developed project based on the original iDesk project by itshieuk:
          https://github.com/itshieuk/iDesk

          APLite is not an official release or endorsement of the original iDesk project.

          This is an unsigned development build compiled by GitHub Actions. Unit tests passed in CI,
          but on-device verification (audio, lock screen, power, certificates, files) is still
          pending — see SYSTEM_TEST_PLAN.md and AUDIO_DIAGNOSTICS.md in the repository.
          EOF
          fi
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS=(--prerelease --latest=false); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/APLite-unsigned-$VERSION.ipa" --clobber
            if [ ${#FLAGS[@]} -gt 0 ]; then gh release edit "$TAG" "${FLAGS[@]}"; fi
          else
            gh release create "$TAG" "build/APLite-unsigned-$VERSION.ipa" --title "APLite ${{ steps.version.outputs.display }}" \
              --notes-file notes.md --generate-notes --target "$GITHUB_SHA" "${FLAGS[@]}"
          fi
