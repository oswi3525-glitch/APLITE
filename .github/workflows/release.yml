name: Release APLite

# Pushing a tag such as v1.0.0 builds an unsigned APLite IPA and publishes it.
# This workflow is intentionally not run by the development branch; releases are created only
# when explicitly requested by pushing a tag or running it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (the tag becomes v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: VERSION=${{ steps.version.outputs.version }} BUILD_NUMBER=${{ github.run_number }} scripts/build-ipa.sh

      - name: Name the IPA after its signing state and version
        run: mv build/APLite.ipa "build/APLite-unsigned-${{ steps.version.outputs.version }}.ipa"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          APLite $VERSION — unsigned IPA. Sign it with your own certificate (ESign, Feather, Scarlet, ...) before installing.

          APLite is an independently developed project based on the original iDesk project by itshieuk:
          https://github.com/itshieuk/iDesk

          APLite is not an official release or endorsement of the original iDesk project.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/APLite-unsigned-$VERSION.ipa" --clobber
          else
            gh release create "$TAG" "build/APLite-unsigned-$VERSION.ipa" --title "APLite $VERSION" \
              --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
          fi
