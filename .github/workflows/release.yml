name: Release

# Push a tag such as v0.2.0 (or run it by hand with a version) to build the unsigned IPA and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (the tag becomes v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: VERSION=${{ steps.version.outputs.version }} BUILD_NUMBER=${{ github.run_number }} scripts/build-ipa.sh

      - name: Name the IPA after the version
        run: mv build/iDesk.ipa "build/iDesk-${{ steps.version.outputs.version }}.ipa"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install

          1. Download **iDesk-$VERSION.ipa** below. It is unsigned.
          2. Open it in a signing app (ESign, Feather, Scarlet, …), sign it and install it.
          3. Connect your iPhone to a monitor with a USB-C → HDMI/DisplayPort cable.

          To run iOS apps inside iDesk, see [Running iOS apps from IPA files](https://github.com/${{ github.repository }}#running-ios-apps-from-ipa-files).

          ## Cài đặt

          1. Tải **iDesk-$VERSION.ipa** bên dưới (chưa ký).
          2. Mở bằng app ký (ESign, Feather, Scarlet…), ký rồi cài.
          3. Cắm iPhone vào màn hình bằng cáp USB-C → HDMI/DisplayPort.

          Chạy app iOS bên trong iDesk: xem [Chạy app iOS từ file IPA](https://github.com/${{ github.repository }}/blob/main/README.vi.md#chạy-app-ios-từ-file-ipa).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/iDesk-$VERSION.ipa" --clobber
          else
            gh release create "$TAG" "build/iDesk-$VERSION.ipa" --title "iDesk $VERSION" \
              --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
          fi
