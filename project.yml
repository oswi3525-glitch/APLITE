name: APLite
options:
  bundleIdPrefix: com.hieuk
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
targets:
  APLite:
    type: application
    platform: iOS
    sources: [iDesk]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hieuk.idesk
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad (a real iPad app, not the enlarged iPhone one)
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: iDesk/iDesk-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: iDesk/Info.plist
      properties:
        CFBundleDisplayName: APLite
        # From the build settings, so scripts/build-ipa.sh (VERSION / BUILD_NUMBER) and releases set them.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        APLiteRepository: oswi3525-glitch/APLITE
        APLiteUpstreamRepository: itshieuk/iDesk
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # APLite takes the whole iPad screen (no Split View / Slide Over): the trackpad and the apps inside need it.
        UIRequiresFullScreen: true
        # Apps loaded into APLite ask for permissions as APLite: iOS terminates an app that requests one
        # without its description in Info.plist, so declare them all.
        NSCameraUsageDescription: An app running in APLite needs this permission.
        NSMicrophoneUsageDescription: Voice typing on the desktop, and apps running in APLite that use the microphone.
        NSPhotoLibraryUsageDescription: An app running in APLite needs this permission.
        NSPhotoLibraryAddUsageDescription: Saves screenshots of the desktop, and photos from apps running in APLite.
        NSLocationWhenInUseUsageDescription: Shows the weather where you are in the desktop widget, and lets apps running in APLite use your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: An app running in APLite needs this permission.
        NSLocationAlwaysUsageDescription: An app running in APLite needs this permission.
        NSContactsUsageDescription: An app running in APLite needs this permission.
        NSCalendarsUsageDescription: An app running in APLite needs this permission.
        NSCalendarsFullAccessUsageDescription: Shows your upcoming events in the desktop widget, and lets apps running in APLite use your calendars.
        NSCalendarsWriteOnlyAccessUsageDescription: An app running in APLite needs this permission.
        NSRemindersUsageDescription: An app running in APLite needs this permission.
        NSRemindersFullAccessUsageDescription: Shows your reminders in the desktop widget, and lets apps running in APLite use your reminders.
        NSBluetoothAlwaysUsageDescription: An app running in APLite needs this permission.
        NSBluetoothPeripheralUsageDescription: An app running in APLite needs this permission.
        NSLocalNetworkUsageDescription: Shows the desktop in a laptop's browser on your Wi-Fi (Use a laptop as the display), and lets apps in APLite reach devices on your network.
        NSMotionUsageDescription: An app running in APLite needs this permission.
        NSSpeechRecognitionUsageDescription: Turns what you say into text for voice typing on the desktop.
        NSFaceIDUsageDescription: An app running in APLite needs this permission.
        NSAppleMusicUsageDescription: An app running in APLite needs this permission.
        NSUserTrackingUsageDescription: An app running in APLite needs this permission.
        NSHealthShareUsageDescription: An app running in APLite needs this permission.
        NSHealthUpdateUsageDescription: An app running in APLite needs this permission.
        NSHomeKitUsageDescription: An app running in APLite needs this permission.
        NSNearbyInteractionUsageDescription: An app running in APLite needs this permission.
        NSSensorKitUsageDescription: An app running in APLite needs this permission.
        NFCReaderUsageDescription: An app running in APLite needs this permission.
        NSFocusStatusUsageDescription: An app running in APLite needs this permission.
        NSIdentityUsageDescription: An app running in APLite needs this permission.
        # Allow "Open in APLite" for .ipa files
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa]
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalSceneDelegate
  # Standalone unit tests: they compile the pure diagnostics model directly, so they need no
  # host app and can run on any iOS Simulator in CI.
  APLiteTests:
    type: unitTestBundle
    platform: iOS
    sources:
      - Tests
      - iDesk/App/AudioDiagnostics.swift
      - iDesk/System/APLiteSettings.swift
      - iDesk/System/SecurityManager.swift
      - iDesk/System/MemoryHeuristics.swift
      - iDesk/System/CertificateRules.swift
      - iDesk/System/FileSorting.swift
      - iDesk/System/WindowLayout.swift
      - iDesk/System/ProjectAnalyzer.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hieuk.aplite.tests
        SWIFT_VERSION: "5.0"
